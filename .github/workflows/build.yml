name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: midway-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Keep one "latest" release so the newest APK is always at the same link.
      # yoav.ekshtein.com picks it up from there.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Midway.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Midway.apk \
            --title "Midway (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download Midway.apk on your phone to install or update."
      - name: Assemble download page
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p _site
          cp app/build/outputs/apk/debug/app-debug.apk _site/midway.apk
          mkdir -p _site/app
          cp app/src/main/assets/index.html _site/app/index.html
          # The two web apps: the same page, each locked to one feature.
          mkdir -p _site/meet _site/pair
          sed 's/<html lang="en">/<html lang="en" data-app="Meet">/' app/src/main/assets/index.html > _site/meet/index.html
          sed -e 's/<html lang="en">/<html lang="en" data-app="Pair">/' -e 's|<title>Midway</title>|<title>Nearby Pair</title>|' \
              app/src/main/assets/index.html > _site/pair/index.html
          sed -e "s/__VERSION__/${version}/g" \
              -e "s/__DATE__/$(date -u +'%Y-%m-%d %H:%M UTC')/g" \
              -e "s/__SHA__/${GITHUB_SHA::7}/g" \
              site/index.html > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
